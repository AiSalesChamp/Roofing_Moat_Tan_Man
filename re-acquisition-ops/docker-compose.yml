# RE Acquisition Ops — sidecar stack (AI, contracts, capture, media gateway)
# Ports bind to BIND_HOST (default 127.0.0.1) — not reachable from LAN.
# CRM itself runs on the host via `./bin/re-ops up` (yarn start).
#
# Usage: from re-acquisition-ops/ with .env present
#   docker compose up -d

name: ${COMPOSE_PROJECT_NAME:-re-ops}

services:
  # Bundled Ollama only if host has nothing on :11434.
  # Default: use host Ollama via host.docker.internal (see OLLAMA_BASE_URL_FROM_DOCKER).
  # Enable with: docker compose --profile bundled-ollama up -d
  ollama:
    profiles: ['bundled-ollama']
    image: ollama/ollama:latest
    ports:
      - '${BIND_HOST:-127.0.0.1}:11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  n8n:
    image: n8nio/n8n:latest
    ports:
      - '${BIND_HOST:-127.0.0.1}:5678:5678'
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678
      GENERIC_TIMEZONE: America/Chicago
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      TWENTY_API_URL: ${TWENTY_API_URL_FROM_DOCKER:-http://host.docker.internal:3000}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_FROM_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      N8N_CONTRACT_WEBHOOK_SECRET: ${N8N_CONTRACT_WEBHOOK_SECRET}
      N8N_CAPTURE_WEBHOOK_SECRET: ${N8N_CAPTURE_WEBHOOK_SECRET}
      N8N_VOICE_WEBHOOK_SECRET: ${N8N_VOICE_WEBHOOK_SECRET}
      GOTENBERG_URL: ${GOTENBERG_URL_FROM_DOCKER:-http://gotenberg:3000}
      MEDIA_GATEWAY_URL: ${MEDIA_GATEWAY_URL_FROM_DOCKER:-http://host.docker.internal:3081}
      MEDIA_GATEWAY_SECRET: ${MEDIA_GATEWAY_SECRET}
      DOCUSEAL_URL: http://docuseal:3000
      DOCUSEAL_API_TOKEN: ${DOCUSEAL_API_TOKEN:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ../re-acquisition/n8n-workflows:/home/node/workflows:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      gotenberg:
        condition: service_started
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - '${BIND_HOST:-127.0.0.1}:3005:8080'
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_FROM_DOCKER:-http://host.docker.internal:11434}
      # Local-only auth: password from .env (generated by re-ops init)
      WEBUI_AUTH: 'true'
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: 'true'
      DEFAULT_USER_ROLE: user
      ENABLE_RAG_WEB_SEARCH: 'false'
      ENABLE_COMMUNITY_SHARING: 'false'
      ENABLE_TELEMETRY: 'false'
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - open-webui-data:/app/backend/data
      - ../re-acquisition/copilot/knowledge:/app/backend/data/knowledge/re-acquisition:ro
      - ../re-acquisition/copilot/exports:/app/backend/data/knowledge/exports:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  docuseal:
    image: docuseal/docuseal:latest
    ports:
      - '${BIND_HOST:-127.0.0.1}:3030:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@docuseal-db:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
    volumes:
      - docuseal-data:/data
    depends_on:
      docuseal-db:
        condition: service_healthy
    restart: unless-stopped

  docuseal-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal
    volumes:
      - docuseal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -h localhost -d docuseal
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '${BIND_HOST:-127.0.0.1}:3002:3000'
    command:
      - 'gotenberg'
      - '--chromium-disable-javascript=true'
      - '--chromium-allow-list=file:///tmp/.*'
    restart: unless-stopped

  media-gateway:
    build: ./services/media-gateway
    ports:
      - '${BIND_HOST:-127.0.0.1}:3081:3081'
    environment:
      PORT: 3081
      BIND_HOST: 0.0.0.0
      TWENTY_API_URL: ${TWENTY_API_URL_FROM_DOCKER:-http://host.docker.internal:3000}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      MEDIA_GATEWAY_SECRET: ${MEDIA_GATEWAY_SECRET}
      ATTACHMENT_FILE_FIELD_METADATA_ID: ${ATTACHMENT_FILE_FIELD_METADATA_ID:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  capture-pwa:
    image: nginx:alpine
    ports:
      - '${BIND_HOST:-127.0.0.1}:3080:80'
    volumes:
      - ../re-acquisition/property-capture/pwa:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  ollama-data:
  n8n-data:
  open-webui-data:
  docuseal-data:
  docuseal-db-data:
