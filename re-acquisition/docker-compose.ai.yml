# Local AI stack: Ollama, n8n, Open WebUI
# Run: docker compose -f re-acquisition/docker-compose.ai.yml up -d
# Requires Twenty CRM at localhost:3000 (./start-local.sh)

name: re-ai-stack

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  n8n:
    image: n8nio/n8n:latest
    ports:
      - '5678:5678'
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: America/Chicago
      TWENTY_API_URL: ${TWENTY_API_URL:-http://host.docker.internal:3000}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      N8N_CONTRACT_WEBHOOK_SECRET: ${N8N_CONTRACT_WEBHOOK_SECRET:-change-me}
      N8N_CAPTURE_WEBHOOK_SECRET: ${N8N_CAPTURE_WEBHOOK_SECRET:-change-me}
      N8N_VOICE_WEBHOOK_SECRET: ${N8N_VOICE_WEBHOOK_SECRET:-change-me}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://host.docker.internal:3002}
    volumes:
      - n8n-data:/home/node/.n8n
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - '3005:8080'
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: 'false'
      ENABLE_RAG_WEB_SEARCH: 'false'
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
    volumes:
      - open-webui-data:/app/backend/data
      - ./copilot/knowledge:/app/backend/data/knowledge/re-acquisition:ro
      - ./copilot/exports:/app/backend/data/knowledge/exports:ro
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama-data:
  n8n-data:
  open-webui-data:
